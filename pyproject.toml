[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axentra"
dynamic = ["version"]
description = "Axentra: a modular, reusable backend foundation for SaaS products (identity, tenancy, access, data, storage, jobs, usage, billing, notifications, audit)."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "cryptography>=42",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
# The HTTP API (FastAPI app, `axentra serve`).
server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# OpenID Connect logins.
oidc = ["PyJWT[crypto]>=2.9", "httpx>=0.27"]
# S3-compatible object storage.
s3 = ["boto3>=1.34"]
# OpenTelemetry tracing and metrics export.
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
all = ["axentra[server,oidc,s3,otel]"]
dev = [
    "axentra[server,oidc]",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.13",
    "ruff>=0.8",
    "moto[s3,server]>=5",
    "boto3>=1.34",
    "import-linter>=2.1",
    "aiosmtpd>=1.4",
    "opentelemetry-sdk>=1.25",
    # Only for the tests of the optional structlog processor (axentra.core.db_errors); not a runtime dependency.
    "structlog>=24",
    # The PostgreSQL test fixtures of tests/conftest.py (TABRION MIG-AXE-1). A range only (RC-1): Tabrion is not on
    # a package index, so install with `pip install -r requirements/tabrion.txt -e ".[dev]"` (pip 25.0 or newer).
    "tabrion[testing,postgres]>=0.1,<0.2",
]

[project.scripts]
axentra = "axentra.cli:main"

[project.urls]
Repository = "https://github.com/peterkarlhuber/axentra"

[tool.hatch.version]
path = "src/axentra/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axentra"]

[tool.hatch.build.targets.sdist]
include = ["src/axentra", "README.md", "LICENSE", "CHANGELOG.md", "NOTICE.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# scripts/check_dependency_policy.py is an unchanged, checksummed copy from nodestro-studio (TABRION QA-17), linted there.
extend-exclude = ["scripts/check_dependency_policy.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["S101", "B008", "RUF012", "S608", "UP040", "E501"]

[tool.ruff.lint.per-file-ignores]
"examples/**/tests/**" = ["PT018", "RUF059", "PT022", "RUF005", "S105", "S106", "S107", "S311", "S603", "S607", "S108", "B017", "PT011", "S113"]
"tests/**" = ["PT018", "RUF059", "PT022", "RUF005", "S105", "S106", "S107", "S311", "S603", "S607", "S108", "B017", "PT011", "S113"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["axentra"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["axentra"]
mypy_path = "src"
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "moto.*", "jwt.*", "opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "examples/taskboard/tests"]
# sdk/ holds the client SDKs with their own test suites and configuration (sdk/python/pyproject.toml).
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "sdk"]
addopts = "-ra --strict-markers"
markers = [
    "postgres: needs a real PostgreSQL (AXENTRA_TEST_DATABASE_URL)",
    "slow: slower integration tests",
]
filterwarnings = ["error::DeprecationWarning:axentra.*"]

[tool.coverage.run]
source = ["axentra"]
branch = true

[tool.importlinter]
root_package = "axentra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules do not depend on the HTTP layer or web frameworks"
type = "forbidden"
source_modules = [
    "axentra.core", "axentra.config", "axentra.data", "axentra.identity", "axentra.tenancy",
    "axentra.access", "axentra.audit", "axentra.platform", "axentra.storage",
    "axentra.notify", "axentra.observability", "axentra.usage", "axentra.billing", "axentra.events",
    "axentra.search",
]
forbidden_modules = ["axentra.api", "axentra.cli", "fastapi", "starlette", "uvicorn"]

# Also forbids Tabrion Studio (TABRION MIG-AXE-1, plan 06 section 7.4); the name stays, tests refer to it.
[[tool.importlinter.contracts]]
name = "Axentra never depends on Nodestro, orkexa or Axentra Studio"
type = "forbidden"
source_modules = ["axentra"]
forbidden_modules = [
    "nodestro_runtime", "nodestro_api", "nodestro_studio", "nodestro", "orkexa", "axentra_studio", "tabrion_studio",
]

[[tool.importlinter.contracts]]
name = "Usage never depends on billing"
type = "forbidden"
source_modules = ["axentra.usage"]
forbidden_modules = ["axentra.billing"]

[[tool.importlinter.contracts]]
name = "Core is the bottom layer"
type = "forbidden"
source_modules = ["axentra.core"]
forbidden_modules = [
    "axentra.config", "axentra.data", "axentra.identity", "axentra.tenancy", "axentra.access",
    "axentra.audit",
    "axentra.platform", "axentra.api", "axentra.cli",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B608"]
