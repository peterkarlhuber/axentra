name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types, architecture, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: lint-imports
      - name: OpenAPI contract is current
        run: axentra openapi export --check

  test:
    name: Tests (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", postgres: "15" }
          - { python: "3.12", postgres: "16" }
          - { python: "3.13", postgres: "17" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXENTRA_TEST_DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: PostgreSQL client matching the server (backup/restore test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.postgres }}
          echo "AXENTRA_TEST_PG_BINDIR=/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_ENV"
      - name: Run tests (skips are reported, not hidden)
        run: pytest -ra --cov --cov-report=term --junitxml=test-results.xml
      - name: Fail if PostgreSQL tests were skipped
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("test-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          skipped = int(suite.get("skipped", 0))
          print(f"tests={suite.get('tests')} failures={suite.get('failures')} errors={suite.get('errors')} skipped={skipped}")
          raise SystemExit(1 if skipped else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python }}-pg${{ matrix.postgres }}
          path: test-results.xml

  package:
    name: Package builds and installs headless
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the core wheel without extras and import the library
        run: |
          python -m venv /tmp/core && /tmp/core/bin/pip install dist/*.whl
          /tmp/core/bin/python -c "import axentra.platform, axentra.identity, axentra.tenancy; print('core ok')"
          ! /tmp/core/bin/python -c "import fastapi" 2>/dev/null
      - name: Install with the server extra (no Studio, no Nodestro, no orkexa)
        run: |
          python -m venv /tmp/srv && /tmp/srv/bin/pip install "$(ls dist/*.whl)[server]"
          /tmp/srv/bin/axentra --version
          /tmp/srv/bin/pip freeze | tee /tmp/freeze.txt
          ! grep -Ei "nodestro|orkexa|axentra-studio" /tmp/freeze.txt

  container:
    name: Container image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.single.yml config -q
          docker compose -f deploy/compose/docker-compose.multi.yml config -q
      - name: Build the image
        run: docker build -t axentra:ci .
      - name: Image runs as non-root and has no forbidden dependencies
        run: |
          docker run --rm axentra:ci --version
          test "$(docker run --rm --entrypoint id axentra:ci -u)" = "10001"
          ! docker run --rm --entrypoint pip axentra:ci freeze | grep -Ei "nodestro|orkexa|axentra-studio"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[server,oidc,s3]" pip-audit bandit
      - run: bandit -q -r src -c pyproject.toml
      - run: pip-audit --skip-editable --progress-spinner off
