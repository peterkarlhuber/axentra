name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

# Every action is pinned by commit SHA (the version is the trailing comment); Dependabot keeps the pins current.
# Checkouts do not keep the token in the Git configuration (persist-credentials: false).
permissions:
  contents: read

concurrency:
  # CI-FAST AP1: a new push to a pull request cancels the older run of that pull request. Every other run (master
  # push, schedule, dispatch, and the nightly's workflow_call, where github.workflow is "Nightly") gets its own group
  # from github.run_id, so it is never cancelled and never waits behind another run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, types, architecture, contract
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.6 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # TABRION VER-1: pyproject.toml names Tabrion by a range only; requirements/tabrion.txt says where it comes
      # from (one pin on a final release). It must be in the same pip command as the project (-r, never -c).
      - run: pip install -r requirements/tabrion.txt -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: mypy
      - name: Type-check the examples (Taskboard, deployment demos)
        run: |
          MYPYPATH=src:examples/taskboard mypy --strict -p taskboard
          for f in examples/multi-product/provision.py examples/single-product/provision.py examples/taskboard/walkthrough.py; do
            MYPYPATH=src:examples/common mypy --strict "$f"
          done
      - run: lint-imports
      - name: OpenAPI contract is current
        run: axentra openapi export --check

  test:
    name: Tests (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 20 # CI-FAST AP1: p99 7.8 min, slowest entry 3.12 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", postgres: "15" }
          - { python: "3.12", postgres: "16" }
          - { python: "3.13", postgres: "17" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXENTRA_TEST_DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The exact patch level matters for the address checks (MUP-ONA T-AX-NET-2): setup-python installs the
      # current 3.11.x / 3.12.x / 3.13.x, and tests/unit/test_http_client_addresses.py runs on each of them.
      - name: Python version
        run: python -VV
      - run: python -m pip install --upgrade pip
      # TABRION VER-1: pyproject.toml names Tabrion by a range only; requirements/tabrion.txt says where it comes
      # from (one pin on a final release). It must be in the same pip command as the project (-r, never -c).
      - run: pip install -r requirements/tabrion.txt -e ".[dev]"
      - name: PostgreSQL client matching the server (backup/restore test)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-${{ matrix.postgres }}
          echo "AXENTRA_TEST_PG_BINDIR=/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_ENV"
      - name: Run tests (skips are reported, not hidden)
        run: pytest -ra --cov --cov-report=term --junitxml=junit-test.xml
      # The skipped tests must equal tests/ci/skipped-test.txt (one line per test with its reason); an unexpected
      # skip (for example PostgreSQL tests without a database) or a test that no longer skips fails the job.
      - name: Skipped tests match the expectation
        run: python scripts/check_skips.py junit-test.xml tests/ci/skipped-test.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-py${{ matrix.python }}-pg${{ matrix.postgres }}
          path: junit-test.xml

  pip-compat:
    # TABRION VER-1 (plan 06 section 6.4): the documented install, `-r requirements/tabrion.txt` together with the
    # project, works with the minimum supported pip (25.0; 23.3 and 24.0 refuse the combination) and the current one,
    # in a fresh environment without the pip cache, and resolves Tabrion to the pinned commit.
    name: Install with pip ${{ matrix.pip }} (Tabrion pin)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # new job (TABRION VER-1): two installs and one test file
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pip: "25.0", spec: "pip==25.0" }
          - { pip: "current", spec: "pip" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Development install (editable, dev extra)
        env:
          PIP_SPEC: ${{ matrix.spec }}
        run: |
          python -m venv /tmp/dev
          /tmp/dev/bin/python -m pip install --upgrade "$PIP_SPEC"
          /tmp/dev/bin/pip --version
          /tmp/dev/bin/pip install --no-cache-dir -r requirements/tabrion.txt -e ".[dev]"
          /tmp/dev/bin/pip check
          /tmp/dev/bin/python -m pytest -q -p no:cacheprovider tests/unit/test_tabrion_requirements.py
      - name: Library install (wheel from this checkout, no extras)
        env:
          PIP_SPEC: ${{ matrix.spec }}
        run: |
          python -m venv /tmp/lib
          /tmp/lib/bin/python -m pip install --upgrade "$PIP_SPEC"
          /tmp/lib/bin/pip install --no-cache-dir -r requirements/tabrion.txt .
          /tmp/lib/bin/pip check
          /tmp/lib/bin/python -c "import axentra, tabrion; print('axentra', axentra.__version__, 'tabrion', tabrion.__version__)"
          ! /tmp/lib/bin/python -c "import pytest" 2>/dev/null

  sdk-typescript:
    name: TypeScript SDK (generated types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 0.6 min (successful runs 2026-11-01..07)
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Known vulnerabilities in what the published package depends on (dev tools are not shipped).
      - name: Dependency audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Generated types match the committed OpenAPI
        run: npm run generate:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  sdk-python:
    name: Python SDK (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 2.6 min, slowest entry 3.11 (successful runs 2026-11-01..07)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXENTRA_TEST_DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: The client installs and its unit tests pass WITHOUT the server package
        run: |
          python -m venv /tmp/client && /tmp/client/bin/pip install "./sdk/python[test]"
          ! /tmp/client/bin/python -c "import axentra" 2>/dev/null
          cd sdk/python && /tmp/client/bin/python -m pytest -q -p no:cacheprovider tests/unit
      # TABRION MIG-AXE-3: Axentra requires Tabrion at runtime; requirements/tabrion.txt says where it comes from.
      - run: pip install -r requirements/tabrion.txt -e ".[server]" -e "./sdk/python[test]"
      - name: Lint, types, generated sync client
        working-directory: sdk/python
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy
          python scripts/unasync.py --check
      - name: Unit + integration tests against an in-process server
        working-directory: sdk/python
        run: pytest -ra tests/unit tests/integration --junitxml=junit-sdk-python.xml
      - name: Skipped tests match the expectation
        run: python scripts/check_skips.py sdk/python/junit-sdk-python.xml tests/ci/skipped-sdk-python.txt

  sdk-e2e:
    name: SDK contract tests against axentra serve
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.4 min (successful runs 2026-11-01..07)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AXENTRA_TEST_DATABASE_URL: postgresql://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: python -m pip install --upgrade pip
      # TABRION MIG-AXE-3: Axentra requires Tabrion at runtime; requirements/tabrion.txt says where it comes from.
      - run: pip install -r requirements/tabrion.txt -e ".[server]" -e "./sdk/python[test]"
      - run: npm ci --no-audit --no-fund
        working-directory: sdk/typescript
      - name: Start a PostgreSQL-backed server and run both SDK e2e suites
        run: AXENTRA_PYTHON="$(command -v python)" SDK_E2E_JUNITXML="$PWD/junit-sdk-e2e.xml" scripts/sdk-e2e.sh
      - name: Skipped tests match the expectation (Python SDK e2e suite)
        run: python scripts/check_skips.py junit-sdk-e2e.xml tests/ci/skipped-sdk-e2e.txt

  package:
    name: Package builds and installs headless
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 0.7 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # TABRION MIG-AXE-3: Axentra requires Tabrion at runtime, which is not on a package index (VER-1, V-B0).
      - name: Install the core wheel without extras and import the library
        run: |
          python -m venv /tmp/core && /tmp/core/bin/python -m pip install -q --upgrade pip
          /tmp/core/bin/pip install -r requirements/tabrion.txt dist/*.whl
          /tmp/core/bin/python -c "import axentra.platform, axentra.identity, axentra.tenancy; print('core ok')"
          ! /tmp/core/bin/python -c "import fastapi" 2>/dev/null
      - name: Install with the server extra (no Studio, no Nodestro, no orkexa)
        run: |
          python -m venv /tmp/srv && /tmp/srv/bin/python -m pip install -q --upgrade pip
          /tmp/srv/bin/pip install -r requirements/tabrion.txt "$(ls dist/*.whl)[server]"
          /tmp/srv/bin/axentra --version
          /tmp/srv/bin/pip freeze | tee /tmp/freeze.txt
          ! grep -Ei "nodestro|orkexa|axentra-studio" /tmp/freeze.txt

  container:
    name: Container image and compose files
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 1.8 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Base and service images are pinned by digest
        run: |
          python3 -I - <<'PY'
          import re, sys
          loose = []
          for path in ("Dockerfile", "examples/taskboard/Dockerfile"):
              text = open(path).read()
              args = dict(re.findall(r"^ARG (\w+)=(\S+)", text, re.M))
              stages = set(re.findall(r"^FROM \S+ AS (\S+)", text, re.M)) | {"scratch"}
              for base in re.findall(r"^FROM (\S+)", text, re.M):
                  base = args.get(base.strip("${}"), base)
                  if base not in stages and "@sha256:" not in base:
                      loose.append(f"{path}: {base}")
          # Service images of the compose stacks too; the ":local" images are built from this repository.
          for path in ("single", "multi", "taskboard"):
              path = f"deploy/compose/docker-compose.{path}.yml"
              for image in re.findall(r"^\s*image:\s*(\S+)", open(path).read(), re.M):
                  if not image.endswith(":local") and "@sha256:" not in image:
                      loose.append(f"{path}: {image}")
          sys.exit(f"not pinned by digest: {loose}" if loose else 0)
          PY
      - name: Compose files are valid
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.single.yml config -q
          docker compose -f deploy/compose/docker-compose.multi.yml config -q
          docker compose -f deploy/compose/docker-compose.taskboard.yml config -q
      - name: Hash-pinned locks match deploy/constraints.txt
        run: python3 scripts/check_locks.py
      - name: Build the image
        run: docker build -t axentra:ci .
      # The image carries a CycloneDX SBOM of what it contains (deploy/sbom.py); keep it with the run.
      - name: Extract the SBOM
        run: |
          docker run --rm --entrypoint cat axentra:ci /opt/axentra/sbom.cdx.json > sbom-axentra.cdx.json
          python3 -c "import json; b = json.load(open('sbom-axentra.cdx.json')); assert b['bomFormat'] == 'CycloneDX' and b['metadata']['component']['name'] == 'axentra' and b['components'], b"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-axentra
          path: sbom-axentra.cdx.json
      # The documented full image: a constraint bump that breaks an extra (for example python-dateutil
      # 3.0.0 against botocore, AX3-05) fails here, not at the first deployment that needs it.
      - name: Build the full image (server,oidc,s3,otel) and import every extra
        run: |
          docker build --build-arg EXTRAS=server,oidc,s3,otel -t axentra:ci-full .
          docker run --rm --entrypoint python axentra:ci-full -c "import axentra.identity.oidc, jwt, httpx, boto3, opentelemetry.sdk, opentelemetry.exporter.otlp.proto.http; print('extras ok')"
          docker run --rm --entrypoint pip axentra:ci-full check
          test "$(docker run --rm --entrypoint id axentra:ci-full -u)" = "10001"
      - name: Build the Taskboard demo image
        run: docker build -f examples/taskboard/Dockerfile -t taskboard:ci .
      # Start the single- and multi-product compose stacks from the image just built (db, migrate as the owner
      # role, api as the restricted role) and drive setup, a product, a tenant and a record through the API.
      - name: Compose stacks start and serve (smoke)
        run: |
          docker tag axentra:ci axentra:local
          scripts/compose_smoke.sh single 18080
          scripts/compose_smoke.sh multi 18081
      - name: Image runs as non-root and has no forbidden dependencies
        run: |
          docker run --rm axentra:ci --version
          test "$(docker run --rm --entrypoint id axentra:ci -u)" = "10001"
          ! docker run --rm --entrypoint pip axentra:ci freeze | grep -Ei "nodestro|orkexa|axentra-studio"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15 # CI-FAST AP1: p99 0.8 min (successful runs 2026-11-01..07)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # TABRION MIG-AXE-3: requirements/tabrion.txt for the runtime dependency on Tabrion. pip-audit cannot audit
      # Tabrion (not on PyPI) and reports it as skipped; its own CI audits it.
      - run: pip install -r requirements/tabrion.txt -e ".[server,oidc,s3]" pip-audit==2.10.1 bandit
      - run: bandit -q -r src -c pyproject.toml
      # Known vulnerabilities in the installed dependencies (the pattern of nodestro-runtime's CI). Blocking: an
      # advisory that was reviewed and cannot be fixed yet goes into PIP_AUDIT_IGNORE (space-separated IDs, each
      # with its reason in this comment). None today.
      - name: Dependency audit
        env:
          PIP_AUDIT_IGNORE: ""
        run: |
          args=(); for id in $PIP_AUDIT_IGNORE; do args+=(--ignore-vuln "$id"); done
          pip-audit --skip-editable --progress-spinner off "${args[@]}"
