# Weekly, grouped update pull requests with a small limit, like the Nodestro repositories. Every action in the
# workflows is pinned by commit SHA (the version is the trailing comment); Dependabot keeps those pins current, and
# the digests of the Python base image in the Dockerfiles and of the compose stacks' postgres image.
# pip covers pyproject.toml, the image pins in deploy/constraints.txt and the Python SDK. The root entry
# also finds deploy/constraints.txt (PR #35 updated it "in /"), so /deploy is not listed separately: with
# both, every pin change came twice (audit round 3, AX3-06: #35 and #36 were the same change).
# cooldown: a new release is proposed only after a few days (a week for package majors), so a broken or compromised release
# is usually withdrawn before it reaches a pull request; security updates are not delayed. Merging stays manual
# (no auto-merge; docs/TODO.md, "Release and verification").
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories: [/, /sdk/python]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tabrion is not on a package index: requirements/tabrion.txt and deploy/locks/tabrion.txt pin its commit, and a
      # PyPI project of that name would be someone else's (dependency confusion, TABRION DC-AX-1).
      - dependency-name: tabrion
      # botocore (s3 extra) requires python-dateutil < 3; a 3.x pin makes the full image unresolvable (AX3-05).
      # Remove once botocore allows it.
      - dependency-name: python-dateutil
        versions: [">=3"]

  - package-ecosystem: docker
    directories: [/, /examples/taskboard]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2

  # The postgres service image of the compose stacks (pinned by digest, checked in CI).
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript majors wait for openapi-typescript (peer typescript ^5.x); @types/node follows the
      # oldest supported Node (engines >=20, CI 22), not the newest (AX3: #33, #34).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
