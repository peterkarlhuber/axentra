# Taskboard: a single-product Axentra installation embedded in the Taskboard process.
# Load with AXENTRA_CONFIG=examples/taskboard/taskboard.toml; override anything with AXENTRA__*.
# Development defaults (plain http on localhost). For production see docs/operations/DEPLOYMENT.md.

environment = "development"
mode = "single"

[product]
slug = "taskboard"
name = "Taskboard"

[database]
# Set the URL from the environment: AXENTRA__DATABASE__URL=postgresql://$USER@127.0.0.1:5432/taskboard
# for a local trial, or url_ref = "env:AXENTRA_DATABASE_URL" with the runtime role (no superuser,
# no BYPASSRLS) in production; migrations then run as the schema owner (see the compose file).
pool_max = 10

[security]
# The Axentra API is mounted under /axentra, so its public URL (download links, OIDC redirect
# URIs) includes the prefix. Browser origins must therefore be listed explicitly.
public_url = "http://127.0.0.1:8090/axentra"
allowed_origins = ["http://127.0.0.1:8090"]
password_min_length = 12

[storage]
backend = "local"
local_path = "./var/taskboard-files"
max_file_bytes = 10485760

[billing]
# Demo: no payment is collected; workspace admins switch plans with PUT /api/workspaces/{id}/plan.
provider = "manual"

[observability]
log_format = "text"
