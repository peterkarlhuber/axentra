[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taskboard-example"
version = "0.1.0"
description = "Taskboard: a demo multi-tenant SaaS backend built on Axentra"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # In this repository: pip install -e ../..[server] first (Axentra is not on PyPI yet).
    "axentra[server]",
    "httpx>=0.27",
]

[project.scripts]
taskboard = "taskboard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["taskboard"]
