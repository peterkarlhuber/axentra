[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axentra-client"
dynamic = ["version"]
description = "Python HTTP client for the Axentra API (sync and async, typed models). Pure client: no server dependency."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Peter Karlhuber" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.optional-dependencies]
# Unit tests need only these; the integration tests also need the `axentra` server package
# (installed from the repository root: pip install -e "../..[server]").
test = ["pytest>=8", "anyio>=4", "mypy>=1.13", "ruff>=0.8"]

[tool.hatch.version]
path = "src/axentra_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axentra_client"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/axentra_client/_sync/client.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["S101", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S311", "PT011", "S104", "S603", "PT018", "B017", "S108"]
"scripts/**" = ["S603"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["axentra_client"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/axentra_client", "tests", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the axentra server package and PostgreSQL (AXENTRA_TEST_DATABASE_URL)",
    "e2e: needs a running server (AXENTRA_SDK_E2E_URL, see scripts/sdk-e2e.sh)",
]
