# Axentra in multi-product mode: PostgreSQL 16, a one-shot migration job and the API.
#
#   cp .env.example .env    # local trial (development, loopback); production: .env.production.example
#   docker compose -f docker-compose.multi.yml up -d --build
#   docker compose -f docker-compose.multi.yml run --rm api admin setup-token
#
# See docs/operations/DEPLOYMENT.md. Configuration: ../config/multi.toml (+ env overrides below).

name: axentra-multi

x-axentra: &axentra
  image: axentra:local
  build:
    context: ../..
    dockerfile: Dockerfile
  environment: &axentra-env
    AXENTRA_CONFIG: /etc/axentra/axentra.toml
    AXENTRA_MASTER_KEYS: ${AXENTRA_MASTER_KEYS:?set AXENTRA_MASTER_KEYS in .env}
    AXENTRA__ENVIRONMENT: ${AXENTRA_ENVIRONMENT:-production}
    AXENTRA__SECURITY__PUBLIC_URL: ${AXENTRA_PUBLIC_URL:?set AXENTRA_PUBLIC_URL in .env}
    AXENTRA__SECURITY__ALLOWED_ORIGINS: ${AXENTRA_ALLOWED_ORIGINS:-[]}
  configs:
    - source: axentra
      target: /etc/axentra/axentra.toml
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
    restart: unless-stopped
    environment:
      POSTGRES_DB: axentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      AXENTRA_DB_OWNER_PASSWORD: ${AXENTRA_DB_OWNER_PASSWORD:?set AXENTRA_DB_OWNER_PASSWORD in .env}
      AXENTRA_DB_APP_PASSWORD: ${AXENTRA_DB_APP_PASSWORD:?set AXENTRA_DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d axentra"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host; use `docker compose exec db psql -U postgres axentra`.

  migrate:
    <<: *axentra
    # Afterwards the application role gets data access to every table (and read-only access to the
    # migration bookkeeping): `axentra db grant-runtime-role`, idempotent.
    command: ["migrate", "--grant-runtime-role", "axentra_app"]
    restart: "no"
    environment:
      <<: *axentra-env
      # Migrations run as the schema owner.
      AXENTRA_DATABASE_URL: postgresql://axentra_owner:${AXENTRA_DB_OWNER_PASSWORD}@db:5432/axentra
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *axentra
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    environment:
      <<: *axentra-env
      # The API runs as the restricted application role, so row-level security applies.
      AXENTRA_DATABASE_URL: postgresql://axentra_app:${AXENTRA_DB_APP_PASSWORD}@db:5432/axentra
    ports:
      # Loopback only by default: put a TLS reverse proxy in front, or set AXENTRA_BIND_ADDRESS (C-03).
      - "${AXENTRA_BIND_ADDRESS:-127.0.0.1}:${AXENTRA_HTTP_PORT:-8080}:8080"
    volumes:
      # Local file storage and other runtime state (./var relative to the working directory).
      - appdata:/var/lib/axentra/var
    tmpfs:
      - /tmp
    depends_on:
      migrate:
        condition: service_completed_successfully

configs:
  axentra:
    file: ../config/multi.toml

volumes:
  pgdata:
  appdata:
